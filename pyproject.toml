# ==== Project info

[project]
name = "branchpoint"
version = "0.0.1"
description = "Interactive mechanistic interpretability"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Caitlin Lewis", email = "caitlin.lewis@duke.edu" },
]
keywords = [
    "mechanistic interpretability",
    "machine learning",
    "LLM",
    "interactive visualization"
]

dependencies = [
    "numpy",
    "wgpu>=0.29.0,<0.30",
    "tinygrad",
    "fastplotlib[notebook,imgui]",
    "glfw",
]

[project.optional-dependencies]
torch = [
    "torch",
    "cuda-python",
    "cupy-cuda12x",
]
lint = ["ruff"]
tests = ["pytest"]
notebook = ["jupyterlab"]
dev = ["branchpoint[lint, tests, torch, notebook]"]

[project.urls]
Homepage = "https://github.com/clewis7/branchpoint"

# ===== Building

# Flit is great solution for simple pure-Python projects.
[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

# ===== Tooling

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["D", "F", "E", "W", "N", "B", "RUF", "TC"]
ignore = [
    "E501",   # Line too long
    "E731",   # Do not assign a `lambda` expression, use a `def`
    "B019",   # Use of `functools.lru_cache` or `functools.cache` on methods can lead to memory leaks
    "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`"
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"